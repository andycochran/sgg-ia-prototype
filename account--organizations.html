<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simpler.Grants.gov - IA Usability Prototype</title>
  
  <!-- Relative link to minified styles -->
  <link rel="stylesheet" href="_styles.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/uswds/3.8.0/js/uswds-init.min.js"></script>
  <script src="_header.js" defer></script>
  <script src="_auth.js" defer></script>
  <script src="_footer.js" defer></script>
  <script src="_active-nav.js" defer></script>
</head>
<body data-auth-required="true">

  <site-header></site-header>

  <main id="main-content">
    <div class="grid-container">

      <div class="usa-prose padding-y-6">
        <h1>
          <svg class="usa-icon margin-right-1" aria-hidden="true" focusable="false" role="img"><use href="#icon-groups"></use></svg> 
          Organizations
        </h1>

        <section>

          <ul class="add-list-reset">
            <li class="border-1px border-base-lighter padding-3 margin-bottom-3">
              <div class="grid-row">
                <div class="grid-col-fill">
                  <h3 class="margin-0 margin-top-neg-1"><a href="#">My Organization</a></h3>
                  <strong>Role:</strong> Admin 
                </div>
                <div class="grid-col-auto">
                  <button class="usa-button usa-button--outline">Manage users</button>
                </div>
              </div>
            </li>
            <li class="border-1px border-base-lighter padding-3 margin-bottom-3">
              <div class="grid-row">
                <div class="grid-col-fill">
                  <h3 class="margin-0 margin-top-neg-1"><a href="#">My Organization</a></h3>
                  <strong>Role:</strong> Member
                </div>
                <div class="grid-col-auto">
                  <button class="usa-button usa-button--outline" disabled>Manage users</button>
                </div>
              </div>
            </li>
          </ul>

        </section>

      </div>

    </div>
  </main>

  <site-footer></site-footer>

  <!-- USWDS JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/uswds/3.8.0/js/uswds.min.js"></script>

  </body>
</html>
