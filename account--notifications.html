<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simpler.Grants.gov - IA Usability Prototype</title>
  
  <!-- Relative link to minified styles -->
  <link rel="stylesheet" href="_styles.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/uswds/3.8.0/js/uswds-init.min.js"></script>
  <script src="_header.js" defer></script>
  <script src="_auth.js" defer></script>
  <script src="_footer.js" defer></script>
  <script src="_active-nav.js" defer></script>
</head>
<body data-auth-required="true">

  <site-header></site-header>

  <main id="main-content">
    <div class="grid-container">

      <div class="usa-prose padding-y-6">
        <h1>Notifications</h1>

        <div>

          <h2>Manage your preferences</h2>
          <p>Choose which notifications you'd like to receive about your activity.</p>

          <div class="usa-checkbox margin-bottom-4">
            <input class="usa-checkbox__input" id="name--1" type="checkbox" checked />
            <label class="usa-checkbox__label" for="name--1">
              <strong>Subscribe to saved opportunities</strong><br />
              Get email updates about opportunities you have saved.
            </label>
          </div>

          <h2>Organization preferences</h2>
          <p>Choose which notifications you'd like to receive for organizations you're part of.</p>

          <h3>My Organization</h3>

          <div class="usa-checkbox margin-bottom-4">
            <input class="usa-checkbox__input" id="name--2" type="checkbox" />
            <label class="usa-checkbox__label" for="name--2">
              <strong>Subscribe to saved opportunities</strong><br />
              Get email updates for opportunities saved by you or your organization.
            </label>
          </div>

          <h3>My Non-Profit</h3>

          <div class="usa-checkbox margin-bottom-4">
            <input class="usa-checkbox__input" id="name--3" type="checkbox" checked />
            <label class="usa-checkbox__label" for="name--3">
              <strong>Subscribe to saved opportunities</strong><br />
              Get email updates for opportunities saved by you or your organization.
            </label>
          </div>

        </div>

      </div>

    </div>
  </main>

  <site-footer></site-footer>

  <!-- USWDS JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/uswds/3.8.0/js/uswds.min.js"></script>

  </body>
</html>
