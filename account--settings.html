<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simpler.Grants.gov - IA Usability Prototype</title>
  
  <!-- Relative link to minified styles -->
  <link rel="stylesheet" href="_styles.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/uswds/3.8.0/js/uswds-init.min.js"></script>
  <script src="_header.js" defer></script>
  <script src="_auth.js" defer></script>
  <script src="_footer.js" defer></script>
  <script src="_active-nav.js" defer></script>
</head>
<body data-auth-required="true">

  <site-header></site-header>

  <main id="main-content">
    <div class="grid-container">

      <div class="usa-prose padding-y-6">
        <h1>Settings</h1>
        <h2>Contact information</h2>
        <p>Your name and email will be visible to others in your organization as you collaborate. You may update your name here at any time, but your email and password are managed by <a href="">login.gov</a>.</p>
        <form>
          <label class="usa-label">
            First name
            <span class="usa-hint usa-hint--required"> *</span>
            <p class="text-base-dark margin-top-0">Required to complete your profile.</p>
            <input class="usa-input" type="text" >
          </label>
          <label class="usa-label">
            Middle name
            <input class="usa-input" type="text">
          </label>
          <label class="usa-label">
            Last name
            <span class="usa-hint usa-hint--required"> *</span>
            <p class="text-base-dark margin-top-0">Required to complete your profile.</p>
            <input class="usa-input" type="text">
          </label>
          <label class="usa-label">
            Email
            <input class="usa-input" disabled type="text" value="user@email.com">
          </label>
          <button class="usa-button margin-top-4">Save changes</button>
        </form>
      </div>

    </div>
  </main>

  <site-footer></site-footer>

  <!-- USWDS JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/uswds/3.8.0/js/uswds.min.js"></script>

  </body>
</html>
